# Needs the cPanel API to whitelist the runner's IP before SSH will accept a
# connection. If that API is ever unavailable again, frontend-deploy-ftp.yml is
# the fallback: Actions -> Deploy Frontend (FTP) -> Run workflow.
name: Deploy Frontend

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-*.yml'

permissions:
  contents: read

# Shared with the backend deploy. Two runs at once means two entries in a
# 5-slot SSH whitelist and two IPs racing the firewall, which is how the
# 4 August run failed.
concurrency:
  group: o2switch-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/frontend-build.yml

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: build

      - name: Get runner's public IP
        id: ip
        run: echo "ipv4=$(curl -sf https://api.ipify.org || curl -sf https://ipv4.icanhazip.com)" >> "$GITHUB_OUTPUT"

      - name: Whitelisting the runner IP
        run: |
          curl -sm 45 -H"Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}" \
          "https://${{ secrets.CPANEL_SERVER }}:2083/execute/SshWhitelist/add?address=${{ steps.ip.outputs.ipv4 }}&port=22&direction=in"

      - name: Making sure the IP is whitelisted
        run: |
          curl -sm 45 -H"Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}" \
          "https://${{ secrets.CPANEL_SERVER }}:2083/execute/SshWhitelist/list" | grep "${{ steps.ip.outputs.ipv4 }}"

      - name: Installing the SSH Key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 0400 ~/.ssh/id_rsa

      # The cPanel API confirms the whitelist entry before the packet filter has
      # actually picked it up, so connecting immediately gets the TCP connection
      # reset. Probe until SSH answers rather than letting rsync eat the failure.
      - name: Waiting for the firewall to accept the runner IP
        run: |
          for attempt in $(seq 1 12); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_rsa \
              "${{ secrets.CPANEL_USERNAME }}@${{ secrets.CPANEL_SERVER }}" true 2>&1; then
              echo "SSH accepted on attempt $attempt"
              exit 0
            fi
            echo "Not accepted yet (attempt $attempt), retrying in 10s"
            sleep 10
          done
          echo "::error title=SSH unreachable::The IP was whitelisted but SSH never accepted a connection."
          exit 1

      # Unlike the backend, this deploys to the document root itself -- there is
      # no subdirectory to scope `--delete` to, so anything server-side that the
      # build does not produce has to be named here or it gets deleted.
      # `.well-known` is where AutoSSL puts its ACME challenges; `cgi-bin` and
      # `error_log` are cPanel's.
      - name: Sending data with RSYNC
        run: |
          rsync --timeout=60 -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" \
          --exclude=".env" --exclude=".well-known" --exclude="cgi-bin" \
          --exclude=".htpasswd" --exclude="error_log" \
          -av --delete build/ \
          "${{ secrets.CPANEL_USERNAME }}@${{ secrets.CPANEL_SERVER }}:${{ secrets.FRONTEND_REMOTE_PATH }}"

      - name: Un-whitelisting the runner IP
        if: always()
        run: |
          curl -sm 45 -H"Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}" \
          "https://${{ secrets.CPANEL_SERVER }}:2083/execute/SshWhitelist/remove?address=${{ steps.ip.outputs.ipv4 }}&port=22&direction=in"

      - name: Cleaning SSH keys
        if: always()
        run: rm -fr ~/.ssh

      - name: Cleaning artifacts
        uses: geekyeggo/delete-artifact@v5
        if: always()
        with:
          name: frontend-build
          failOnError: false
