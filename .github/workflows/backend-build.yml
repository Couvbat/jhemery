name: Build Backend

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/backend-*.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  build_backend:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy package.json and package-lock.json to dist
        run: |
          cp package.json dist/
          cp package-lock.json dist/

      # A deploy that fails keeps this for "Re-run failed jobs", so "Re-run all
      # jobs" finds it already there: `overwrite` replaces it rather than failing
      # on the name. Leftovers, and every standalone build's, expire on their own.
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-build
          path: backend/dist
          overwrite: true
          retention-days: 14
