name: Backend PR Check

on:
  # `dev` is the integration branch: features branch off it and PR back into it,
  # and only then does `dev` PR into `master`. Both bases need the same checks —
  # a green feature PR is worth nothing if the branch it merges into is unchecked.
  #
  # Deliberately *not* path-filtered, unlike backend-build.yml. These jobs are
  # required status checks on `master` and `dev`, and GitHub does not read a
  # workflow that never triggered as "passed" — it reads it as still pending. A
  # `paths: backend/**` filter would leave every frontend-only PR waiting on a
  # backend check that is never going to report, unmergeable until someone
  # bypasses the rule. Running the suite on PRs that cannot affect it wastes a
  # couple of runner-minutes; the alternative wedges the merge queue.
  pull_request:
    branches:
      - master
      - dev
  # Re-runs on the merged result. A PR is checked against its own head, so two
  # individually-green branches can still land a broken `dev`; this is the last
  # signal before `dev` is proposed to `master`. `master` is not listed — a push
  # there already triggers backend-build.yml.
  push:
    branches:
      - dev

defaults:
  run:
    working-directory: backend

jobs:
  check:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # No --passWithNoTests: there are real suites now, so an empty run means
      # the test glob broke rather than that there is nothing to check.
      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
