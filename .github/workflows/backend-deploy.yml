# Needs the cPanel API to whitelist the runner's IP before SSH will accept a
# connection. If that API is ever unavailable again, backend-deploy-ftp.yml is
# the fallback: Actions -> Deploy Backend (FTP) -> Run workflow. Unlike the FTP
# path, this one installs dependencies on the server itself, so a lockfile
# change needs no manual step in cPanel.
name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/backend-*.yml'

permissions:
  contents: read

# Shared with the frontend deploy. Two runs at once means two entries in a
# 5-slot SSH whitelist and two IPs racing the firewall, which is how the
# 4 August run failed.
concurrency:
  group: o2switch-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/backend-build.yml

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: build

      - name: Get runner's public IP
        id: ip
        run: echo "ipv4=$(curl -sf https://api.ipify.org || curl -sf https://ipv4.icanhazip.com)" >> "$GITHUB_OUTPUT"

      # cPanel caps the whitelist at five distinct addresses and answers a refusal
      # with HTTP 200 and `"status":0` in the body, so an unchecked `curl` reads as
      # a success. The run then fails two minutes later at the SSH probe instead,
      # blaming the firewall for what is actually a full quota.
      - name: Whitelisting the runner IP
        env:
          CPANEL_AUTH: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_SERVER: ${{ secrets.CPANEL_SERVER }}
          IP: ${{ steps.ip.outputs.ipv4 }}
        run: |
          response=$(curl -sm 45 -H "Authorization: $CPANEL_AUTH" \
            "https://$CPANEL_SERVER:2083/execute/SshWhitelist/add?address=$IP&port=22&direction=in")
          if [ "$(jq -r '.status // empty' <<<"$response" 2>/dev/null)" != "1" ]; then
            # An unauthenticated call returns the cPanel login page, not JSON, so
            # jq fails outright here rather than falling back to its own default.
            reason=$(jq -r '(.errors // ["cPanel reported no error"]) | join("; ")' <<<"$response" 2>/dev/null) || true
            [ -n "$reason" ] || reason="the response was not JSON — check CPANEL_API_TOKEN"
            echo "::error title=SSH whitelist refused::cPanel would not whitelist $IP — $reason. If the quota is full, prune cPanel → Accès SSH → the whitelist and re-run."
            exit 1
          fi
          echo "Whitelisted $IP"

      # `SshWhitelist/list` echoes the caller's own address back as a top-level
      # `ip` field, so grepping the whole payload for the runner IP matches even
      # when the entry was never added — which is how a refused `add` used to sail
      # through this step. Match inside `data.list`, and never print the payload:
      # this is a public repo and that list is every IP allowed to SSH in.
      - name: Making sure the IP is whitelisted
        env:
          CPANEL_AUTH: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_SERVER: ${{ secrets.CPANEL_SERVER }}
          IP: ${{ steps.ip.outputs.ipv4 }}
        run: |
          response=$(curl -sm 45 -H "Authorization: $CPANEL_AUTH" \
            "https://$CPANEL_SERVER:2083/execute/SshWhitelist/list")
          if ! jq -e --arg ip "$IP" \
            '.data.list[]? | select(.address == $ip and .direction == "in")' \
            <<<"$response" >/dev/null 2>&1; then
            echo "::error title=Whitelist entry missing::cPanel accepted the request but $IP is not in the whitelist."
            exit 1
          fi

      - name: Installing the SSH Key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 0400 ~/.ssh/id_rsa

      # The cPanel API confirms the whitelist entry before the packet filter has
      # actually picked it up, so connecting immediately gets the TCP connection
      # reset. Probe until SSH answers rather than letting rsync eat the failure.
      - name: Waiting for the firewall to accept the runner IP
        run: |
          for attempt in $(seq 1 12); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_rsa \
              "${{ secrets.CPANEL_USERNAME }}@${{ secrets.CPANEL_SERVER }}" true 2>&1; then
              echo "SSH accepted on attempt $attempt"
              exit 0
            fi
            echo "Not accepted yet (attempt $attempt), retrying in 10s"
            sleep 10
          done
          echo "::error title=SSH unreachable::The IP was whitelisted but SSH never accepted a connection."
          exit 1

      # Deploys into `dist/` under the app root, which is where the Passenger
      # config cPanel generated points (`PassengerStartupFile dist/main.js`).
      # It also keeps `--delete` scoped to build output: `.htaccess`, the
      # `node_modules` symlink into the venv, `public/`, `tmp/`, `.env` and
      # `uploads/` all live at the app root and cannot be caught by it.
      - name: Sending data with RSYNC
        run: |
          rsync --timeout=60 -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" \
          -av --delete build/ \
          "${{ secrets.CPANEL_USERNAME }}@${{ secrets.CPANEL_SERVER }}:${{ secrets.BACKEND_REMOTE_PATH }}/dist/"

      # Requires the app to be set up via cPanel "Setup Node.js App" (Passenger).
      # BACKEND_APP_ENTRY must point to the venv's activate script shown on that
      # cPanel screen, e.g. /home/<user>/nodevenv/api.jhemery.xyz/24/bin/activate
      #
      # `npm ci` has to run at the app root: that is where cPanel puts the
      # `node_modules` symlink into the virtualenv, and Node resolves it from
      # dist/main.js by walking up. The build copies package.json and
      # package-lock.json into dist/, so they are lifted up before installing.
      - name: Install production dependencies & restart app
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa \
          "${{ secrets.CPANEL_USERNAME }}@${{ secrets.CPANEL_SERVER }}" \
          "source ${{ secrets.BACKEND_APP_ENTRY }} && cd ${{ secrets.BACKEND_REMOTE_PATH }} && cp dist/package.json dist/package-lock.json . && npm ci --omit=dev && mkdir -p tmp && touch tmp/restart.txt"

      # Both directions. `add?direction=in` also creates the matching `out` entry,
      # so removing only `in` leaves one behind — and since the quota counts
      # distinct addresses, every run permanently burned another of the five
      # slots. Three leaked runner IPs are what took every deploy down on
      # 4 August; a missing entry here is a normal outcome, not a failure.
      - name: Un-whitelisting the runner IP
        if: always()
        env:
          CPANEL_AUTH: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_SERVER: ${{ secrets.CPANEL_SERVER }}
          IP: ${{ steps.ip.outputs.ipv4 }}
        run: |
          for direction in in out; do
            response=$(curl -sm 45 -H "Authorization: $CPANEL_AUTH" \
              "https://$CPANEL_SERVER:2083/execute/SshWhitelist/remove?address=$IP&port=22&direction=$direction" || true)
            echo "$direction: status $(jq -r '.status' <<<"$response" 2>/dev/null || echo '?')"
          done

      - name: Cleaning SSH keys
        if: always()
        run: rm -fr ~/.ssh

      - name: Cleaning artifacts
        uses: geekyeggo/delete-artifact@v5
        if: always()
        with:
          name: backend-build
          failOnError: false
