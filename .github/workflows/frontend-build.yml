name: Build Frontend

on:
  push:
    branches:
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-*.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  build_frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Vite inlines VITE_API_URL into the bundle at build time, so it has to be
      # set here -- a .env on the server does nothing for a static build. Guarded
      # rather than defaulted: src/lib/api.ts falls back to http://localhost:3000,
      # which deploys and renders perfectly while every API call goes nowhere.
      - name: Check the API URL is configured
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error title=VITE_API_URL is not set::Add it under Settings -> Secrets and variables -> Actions -> Variables, e.g. https://api.jhemery.xyz. Without it the build bakes in http://localhost:3000."
            exit 1
          fi
          echo "Building against $VITE_API_URL"

      # Unlike VITE_API_URL these are optional and deliberately not guarded: with
      # them unset src/lib/analytics.ts injects nothing and the site works, it is
      # just not counted. Failing the build over analytics would be the wrong
      # trade. This step exists so a silently unmeasured deploy is visible in the
      # run log rather than only in an empty dashboard weeks later.
      - name: Report analytics configuration
        env:
          VITE_UMAMI_SRC: ${{ vars.VITE_UMAMI_SRC }}
          VITE_UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID }}
        run: |
          if [ -n "$VITE_UMAMI_SRC" ] && [ -n "$VITE_UMAMI_WEBSITE_ID" ]; then
            echo "Umami enabled, tracker: $VITE_UMAMI_SRC"
          else
            echo "::notice title=Umami analytics is off::Set VITE_UMAMI_SRC and VITE_UMAMI_WEBSITE_ID under Settings -> Secrets and variables -> Actions -> Variables to enable it. Both are needed; the build ships without a tracker while either is missing."
          fi

      - name: Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          # Repository variables, not secrets: a website ID and a public script
          # URL are both visible to anyone who views source on the deployed site.
          VITE_UMAMI_SRC: ${{ vars.VITE_UMAMI_SRC }}
          VITE_UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID }}
          VITE_UMAMI_DOMAINS: ${{ vars.VITE_UMAMI_DOMAINS }}
        run: npm run build

      # `.htaccess` is a dotfile and upload-artifact drops those by default, so
      # without this the SPA fallback and the curl/LLM resume rule never reach
      # the server -- and the deploy's `rsync --delete` removes the copy already
      # there. Silent: the site builds and renders, deep links just 404.
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          include-hidden-files: true
