# Fallback for when the cPanel API is unavailable, which is what the default
# SSH path in backend-deploy.yml depends on to whitelist the runner's IP.
# Manual only: Actions -> Deploy Backend (FTP) -> Run workflow. There is no SSH
# here, so a lockfile change needs "Run NPM Install" in cPanel afterwards --
# the run's job summary says so when it detects one.
name: Deploy Backend (FTP)

on:
  workflow_dispatch:

permissions:
  contents: read

# Shared with the SSH deploys, so a fallback run cannot land on top of
# a normal one in the same directories.
concurrency:
  group: o2switch-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/backend-build.yml

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: backend-build
          path: build

      # FTP_BACKEND_DIR is optional: leave it unset when the FTP account is
      # rooted at the application root. Accepts `api/`, `/api`, `./api` alike.
      # The curl steps below need the path without the leading `./`.
      - name: Resolve remote directory
        id: remote
        env:
          FTP_DIR: ${{ secrets.FTP_BACKEND_DIR }}
        run: |
          dir="${FTP_DIR:-}"
          dir="${dir#./}"
          dir="${dir#/}"
          [ -n "$dir" ] && dir="${dir%/}/"
          echo "path=$dir" >> "$GITHUB_OUTPUT"
          echo "dir=./$dir" >> "$GITHUB_OUTPUT"

      # There is no SSH access, so `npm ci` cannot run on the server. Instead we
      # keep a hash of the lockfile next to the app and compare, to tell whether
      # this deploy needs a manual "Run NPM Install" in cPanel.
      - name: Check whether dependencies changed
        id: deps
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_BACKEND_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_BACKEND_PASSWORD }}
          REMOTE_PATH: ${{ steps.remote.outputs.path }}
        run: |
          new_hash=$(sha256sum build/package-lock.json | cut -d' ' -f1)
          old_hash=$(curl -sf --ssl-reqd --user "$FTP_USER:$FTP_PASS" \
            "ftp://$FTP_SERVER/${REMOTE_PATH}.deploy-deps-hash" || true)
          echo "hash=$new_hash" >> "$GITHUB_OUTPUT"
          if [ "$new_hash" = "$old_hash" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Dependencies unchanged since the last deploy."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Lockfile differs from the one deployed to the server."
          fi

      # Targets `dist/` under the app root, matching the Passenger config cPanel
      # generated (`PassengerStartupFile dist/main.js`) and keeping the sync's
      # deletions away from `.htaccess`, the `node_modules` symlink, `public/`,
      # `tmp/`, `.env` and `uploads/`, which all live at the app root.
      - name: Sync build over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_BACKEND_USERNAME }}
          password: ${{ secrets.FTP_BACKEND_PASSWORD }}
          protocol: ftps
          local-dir: ./build/
          server-dir: ${{ steps.remote.outputs.dir }}dist/
          log-level: minimal

      # cPanel's "Run NPM Install" runs at the app root, so it needs the
      # manifests there rather than in dist/.
      - name: Copy manifests to the app root
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_BACKEND_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_BACKEND_PASSWORD }}
          REMOTE_PATH: ${{ steps.remote.outputs.path }}
        run: |
          for f in package.json package-lock.json; do
            curl -sSf --ssl-reqd -T "build/$f" \
              --user "$FTP_USER:$FTP_PASS" \
              "ftp://$FTP_SERVER/${REMOTE_PATH}$f"
          done

      # Passenger reloads the app when tmp/restart.txt changes. Done with curl
      # rather than the sync action so it is uploaded unconditionally.
      - name: Restart the Node.js app
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_BACKEND_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_BACKEND_PASSWORD }}
          REMOTE_PATH: ${{ steps.remote.outputs.path }}
        run: |
          date -u +"restarted %Y-%m-%dT%H:%M:%SZ by run ${{ github.run_id }}" > restart.txt
          curl -sSf --ssl-reqd --ftp-create-dirs -T restart.txt \
            --user "$FTP_USER:$FTP_PASS" \
            "ftp://$FTP_SERVER/${REMOTE_PATH}tmp/restart.txt"

      - name: Record deployed lockfile hash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_BACKEND_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_BACKEND_PASSWORD }}
          REMOTE_PATH: ${{ steps.remote.outputs.path }}
          NEW_HASH: ${{ steps.deps.outputs.hash }}
        run: |
          printf '%s' "$NEW_HASH" > deps-hash.txt
          curl -sSf --ssl-reqd -T deps-hash.txt \
            --user "$FTP_USER:$FTP_PASS" \
            "ftp://$FTP_SERVER/${REMOTE_PATH}.deploy-deps-hash"

      - name: Report whether a manual npm install is needed
        run: |
          if [ "${{ steps.deps.outputs.changed }}" = "true" ]; then
            echo "::warning title=Manual step required::backend/package-lock.json changed. Open cPanel -> Setup Node.js App -> the api app -> Run NPM Install, then Restart. Until then the app runs against the previously installed dependencies and may fail to boot."
            {
              echo "### :warning: Dependencies changed — manual step required"
              echo
              echo "The code is deployed, but \`node_modules\` on the server is stale."
              echo
              echo "1. cPanel → **Setup Node.js App** → the api application"
              echo "2. **Run NPM Install**"
              echo "3. **Restart**"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Dependencies unchanged — nothing to do in cPanel." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cleaning artifacts
        uses: geekyeggo/delete-artifact@v6
        if: always()
        with:
          name: backend-build
          failOnError: false
