name: Frontend PR Check

on:
  # `dev` is the integration branch: features branch off it and PR back into it,
  # and only then does `dev` PR into `master`. Both bases need the same checks —
  # a green feature PR is worth nothing if the branch it merges into is unchecked.
  #
  # Deliberately *not* path-filtered, unlike frontend-build.yml. These jobs are
  # required status checks on `master` and `dev`, and GitHub does not read a
  # workflow that never triggered as "passed" — it reads it as still pending. A
  # `paths: frontend/**` filter would leave every backend-only PR waiting on a
  # frontend check that is never going to report, unmergeable until someone
  # bypasses the rule. Running the suite on PRs that cannot affect it wastes a
  # couple of runner-minutes; the alternative wedges the merge queue.
  pull_request:
    branches:
      - master
      - dev
  # Re-runs on the merged result. A PR is checked against its own head, so two
  # individually-green branches can still land a broken `dev`; this is the last
  # signal before `dev` is proposed to `master`. `master` is not listed — a push
  # there already triggers frontend-build.yml.
  push:
    branches:
      - dev

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    name: Lint, Test, Type-check & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `lint`, not `lint:fix` — a check that rewrites the working tree and then
      # passes tells you nothing about the commit under review.
      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      # `npm run build` runs type-check and build-only in parallel.
      - name: Build
        run: npm run build

  # Same reasoning as the Lighthouse job below: its own runner, in parallel, because
  # it builds the app and drives three browser engines and there is no reason for a
  # lint error to wait behind that.
  e2e:
    name: Playwright
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Cached on the Playwright version rather than the lockfile hash: the browsers
      # are ~400 MB and only change when that package does. A miss just means the
      # download below runs, so a stale key costs a minute, never correctness.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      # Chromium only: both shipped projects (`chromium` and the Pixel 5 `mobile`
      # emulation) run on it, and pulling Firefox and WebKit for jobs that never launch
      # them costs ~400 MB per cache miss. `E2E_ALL_ENGINES` — see the long note in
      # playwright.config.ts — needs `npx playwright install` without the argument.
      #
      # `--with-deps` only on a cache miss: the apt half is what the cache cannot
      # cover, and the runner image already carries those libraries.
      - name: Install Playwright browsers
        run: npx playwright install chromium ${{ steps.playwright-cache.outputs.cache-hit == 'true' && '' || '--with-deps' }}

      # The suite builds the app itself, via `webServer` in playwright.config.ts —
      # deliberately, so the tests always run against the same artefact `preview`
      # serves rather than whatever happens to be in `dist/`. `VITE_API_URL` is set
      # there too, to an unreachable origin: every backend call is stubbed with
      # `page.route`, and an origin that cannot accidentally succeed means a missing
      # stub fails the test instead of quietly reaching the real api.jhemery.xyz.
      - name: Run Playwright tests
        run: npm run test:e2e

      # Uploaded whether or not the run passed: a failed assertion is exactly when the
      # trace, the screenshot and the video are worth having.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14

  # A separate job rather than more steps on `check`: it runs Lighthouse three
  # times and takes a couple of minutes, and there is no reason for a type error
  # to wait behind that. The two jobs run in parallel and report independently.
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Built without VITE_API_URL on purpose. The repository variable belongs
      # to the deploy workflow; here an unset value makes src/lib/api.ts fall
      # back to a same-origin base, so the live-data calls 404 against LHCI's
      # static server instead of reaching the real backend. That keeps the run
      # hermetic — no PR check should depend on api.jhemery.xyz being up — and
      # it is the same condition the thresholds in lighthouserc.yml were
      # measured against.
      - name: Build
        run: npm run build-only

      # `npm run lighthouse`, not `npx lhci`: npx resolves from the registry
      # when the local binary is missing, and there is an unrelated package
      # published under the bare name `lhci`. The script runs node_modules/.bin.
      #
      # Chrome comes preinstalled on the GitHub-hosted ubuntu runners and LHCI
      # finds it without help; if that ever stops being true this step fails
      # loudly at the healthcheck rather than silently skipping.
      - name: Lighthouse
        run: npm run lighthouse

      # Uploaded whether or not the assertions passed — a failed budget is
      # exactly when the full report is worth reading.
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: frontend/.lighthouseci/reports
          retention-days: 14
