# Automated dependency updates.
#
# The two npm ecosystems are declared separately because frontend/ and backend/
# each have their own lockfile — a single root entry would find neither.
#
# Every entry sets `target-branch: dev`. Without it Dependabot opens against the
# default branch (master), and a push to master with frontend/** or backend/**
# paths *deploys* — so each bump would ship itself to production, skipping the
# integration branch that everything else in this repo goes through. The
# pr-check workflows run on both bases, so a bump still arrives tested and
# built; it just waits for dev to be promoted like any other change.
version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(frontend)'
    groups:
      # One PR for the whole patch/minor stream. Ungrouped, a Vite/Vue/Tailwind
      # stack kept this up to date opens a dozen PRs a week, and a dozen PRs a
      # week is the same as none: they stop getting read.
      frontend-minor:
        update-types:
          - minor
          - patch
    ignore:
      # three.js publishes a breaking minor roughly monthly and @types/three has
      # to move in lockstep; that upgrade is a manual read of the changelog, not
      # something to merge off a green build.
      - dependency-name: three
        update-types: ['version-update:semver-minor']
      - dependency-name: '@types/three'
        update-types: ['version-update:semver-minor']

  - package-ecosystem: npm
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(backend)'
    groups:
      # The @nestjs/* packages expect to be on the same version as each other,
      # so bumping them one PR at a time produces avoidable peer-dep churn.
      nestjs:
        patterns:
          - '@nestjs/*'
      backend-minor:
        update-types:
          - minor
          - patch

  # Pins like actions/checkout@v4 only move when something tells them to.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns:
          - '*'
